<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --claw-orange: #FF6B35;
            --claw-orange-dark: #E55A2B;
            --claw-orange-light: #FFF0EB;
            --deep-blue: #1A365D;
            --warm-white: #FFFFFF;
            --terracotta: #D64045;
            --soft-gray: #F7F7F7;
            --medium-gray: #E2E8F0;
            --dark-gray: #4A5568;
            --success: #38A169;
            --error: #E53E3E;
            --error-bg: #FFF5F5;
            --info: #3182CE;
            --json-key: #0550AE;
            --json-string: #0A3069;
            --json-number: #CF222E;
            --json-boolean: #8250DF;
            --json-null: #6E7781;
            --json-bracket: #1A365D;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1A365D 0%, #2D5A8E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 32px 20px;
        }

        .container {
            background: var(--warm-white);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 960px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--deep-blue);
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .mode-toggle {
            display: flex;
            background: var(--soft-gray);
            border-radius: 8px;
            padding: 4px;
            gap: 4px;
        }

        .mode-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: var(--dark-gray);
        }

        .mode-btn.active {
            background: var(--claw-orange);
            color: var(--warm-white);
        }

        .mode-btn:hover:not(.active) {
            background: var(--medium-gray);
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--claw-orange);
            color: var(--warm-white);
        }

        .btn-primary:hover {
            background: var(--claw-orange-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-secondary {
            background: var(--warm-white);
            color: var(--claw-orange);
            border: 1.5px solid var(--claw-orange);
        }

        .btn-secondary:hover {
            background: var(--claw-orange-light);
        }

        .btn-outline {
            background: transparent;
            color: var(--dark-gray);
            border: 1.5px solid var(--medium-gray);
        }

        .btn-outline:hover {
            background: var(--soft-gray);
            border-color: var(--dark-gray);
        }

        .btn-success {
            background: var(--success);
            color: var(--warm-white);
        }

        .btn-success:hover {
            background: #2F8A4E;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.copied {
            background: var(--success);
            color: var(--warm-white);
            border-color: var(--success);
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            min-height: 400px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--dark-gray);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-label .char-count {
            font-weight: 400;
            text-transform: none;
        }

        .textarea-wrapper {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 380px;
            padding: 16px;
            border: 1.5px solid var(--medium-gray);
            border-radius: 12px;
            font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.7;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: var(--soft-gray);
            color: var(--deep-blue);
            tab-size: 2;
        }

        textarea:focus {
            outline: none;
            border-color: var(--claw-orange);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.15);
            background: var(--warm-white);
        }

        textarea::placeholder {
            color: #A0AEC0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        .output-container {
            flex: 1;
            position: relative;
            min-height: 380px;
            border: 1.5px solid var(--medium-gray);
            border-radius: 12px;
            background: var(--soft-gray);
            overflow: auto;
        }

        .output-container.has-content {
            background: var(--warm-white);
        }

        .output-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #A0AEC0;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
        }

        .output-container.has-content .output-placeholder {
            display: none;
        }

        pre#output {
            margin: 0;
            padding: 16px;
            font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: var(--deep-blue);
            white-space: pre;
            tab-size: 2;
            min-height: 100%;
        }

        .json-key {
            color: var(--json-key);
            font-weight: 500;
        }

        .json-string {
            color: var(--json-string);
        }

        .json-number {
            color: var(--json-number);
        }

        .json-boolean {
            color: var(--json-boolean);
        }

        .json-null {
            color: var(--json-null);
            font-style: italic;
        }

        .json-bracket {
            color: var(--json-bracket);
        }

        .json-colon {
            color: var(--json-bracket);
        }

        .error-box {
            background: var(--error-bg);
            border: 1px solid var(--error);
            border-left: 4px solid var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            align-items: flex-start;
            gap: 10px;
            font-size: 14px;
            color: var(--error);
        }

        .error-box.show {
            display: flex;
        }

        .error-box .error-icon {
            font-size: 18px;
            flex-shrink: 0;
            line-height: 1.4;
        }

        .error-box .error-content {
            line-height: 1.5;
        }

        .error-box .error-position {
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--dark-gray);
            min-height: 20px;
        }

        .status-success {
            color: var(--success);
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .panels {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 24px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            textarea,
            .output-container {
                min-height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{ } JSON 格式化工具</h1>
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="beautify" onclick="setMode('beautify')">美化</button>
                <button class="mode-btn" data-mode="compress" onclick="setMode('compress')">压缩</button>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="formatJSON()">格式化</button>
            <button class="btn btn-outline" onclick="clearAll()">清空</button>
            <button class="btn btn-secondary" onclick="copyResult()" id="copyBtn">📋 复制结果</button>
        </div>

        <div class="error-box" id="errorBox">
            <span class="error-icon">⚠️</span>
            <div class="error-content">
                <span class="error-position" id="errorPosition"></span>
                <span id="errorMessage"></span>
            </div>
        </div>

        <div class="panels">
            <div class="panel">
                <div class="panel-label">
                    <span>输入</span>
                    <span class="char-count" id="inputCount">0 字符</span>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="input"
                        placeholder='粘贴 JSON 到此处，例如：
{
  "name": "张三",
  "age": 25,
  "isAdmin": false
}'
                        oninput="onInputChange()"></textarea>
                </div>
            </div>
            <div class="panel">
                <div class="panel-label">
                    <span>输出</span>
                    <span class="char-count" id="outputCount">0 字符</span>
                </div>
                <div class="output-container" id="outputContainer">
                    <div class="output-placeholder">格式化后的 JSON 将显示在这里</div>
                    <pre id="output"></pre>
                </div>
            </div>
        </div>

        <div class="status-bar">
            <span id="statusText"></span>
            <span id="modeLabel">当前模式：美化</span>
        </div>
    </div>

    <script>
        var currentMode = 'beautify';

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            document.getElementById('modeLabel').textContent =
                '当前模式：' + (mode === 'beautify' ? '美化' : '压缩');
            formatJSON();
        }

        function onInputChange() {
            var input = document.getElementById('input');
            document.getElementById('inputCount').textContent = input.value.length + ' 字符';
        }

        function formatJSON() {
            var input = document.getElementById('input').value.trim();
            var output = document.getElementById('output');
            var outputContainer = document.getElementById('outputContainer');
            var errorBox = document.getElementById('errorBox');
            var errorPosition = document.getElementById('errorPosition');
            var errorMessage = document.getElementById('errorMessage');
            var statusText = document.getElementById('statusText');
            var outputCount = document.getElementById('outputCount');
            var inputCount = document.getElementById('inputCount');

            inputCount.textContent = input.length + ' 字符';

            var hideError = function() {
                errorBox.classList.remove('show');
                statusText.textContent = '';
                statusText.classList.remove('status-success');
            };

            if (!input) {
                output.textContent = '';
                outputContainer.classList.remove('has-content');
                outputCount.textContent = '0 字符';
                hideError();
                return;
            }

            var parsed;
            try {
                parsed = JSON.parse(input);
            } catch (e) {
                showParseError(e, input);
                output.textContent = '';
                outputContainer.classList.remove('has-content');
                outputCount.textContent = '0 字符';
                statusText.textContent = 'JSON 解析失败';
                statusText.classList.remove('status-success');
                return;
            }

            hideError();

            var formatted;
            try {
                formatted = currentMode === 'beautify'
                    ? JSON.stringify(parsed, null, 2)
                    : JSON.stringify(parsed);
            } catch (e) {
                formatted = currentMode === 'beautify'
                    ? JSON.stringify(parsed, null, 2)
                    : JSON.stringify(parsed);
            }

            output.innerHTML = highlightJSON(formatted);
            outputContainer.classList.add('has-content');
            outputCount.textContent = formatted.length + ' 字符';
            statusText.textContent = '✓ JSON 有效';
            statusText.classList.add('status-success');
        }

        function showParseError(e, input) {
            var errorBox = document.getElementById('errorBox');
            var errorPosition = document.getElementById('errorPosition');
            var errorMessage = document.getElementById('errorMessage');

            errorBox.classList.add('show');

            var msg = e.message;
            var posMatch = msg.match(/position\s+(\d+)/i);
            var lineMatch = msg.match(/line\s+(\d+)/i);
            var colMatch = msg.match(/column\s+(\d+)/i);

            if (posMatch) {
                var pos = parseInt(posMatch[1], 10);
                var line = findLineColumn(input, pos);
                errorPosition.textContent = '位置：第 ' + line.line + ' 行，第 ' + line.col + ' 列';
            } else if (lineMatch && colMatch) {
                errorPosition.textContent = '位置：第 ' + lineMatch[1] + ' 行，第 ' + colMatch[1] + ' 列';
            } else {
                var cleanedMsg = msg.replace(/in JSON at position \d+/i, '').trim();
                errorPosition.textContent = cleanedMsg || 'JSON 格式错误';
            }

            var friendlyMsg = getFriendlyErrorMessage(e.message);
            errorMessage.textContent = friendlyMsg;
        }

        function findLineColumn(text, position) {
            var line = 1;
            var col = 1;
            for (var i = 0; i < Math.min(position, text.length); i++) {
                if (text[i] === '\n') {
                    line++;
                    col = 1;
                } else {
                    col++;
                }
            }
            return { line: line, col: col };
        }

        function getFriendlyErrorMessage(msg) {
            var lower = msg.toLowerCase();
            if (lower.indexOf('unexpected token') !== -1 || lower.indexOf('unexpected end') !== -1) {
                var tokenMatch = msg.match(/Unexpected token [''](.+?)['']/i);
                if (tokenMatch) {
                    var token = tokenMatch[1];
                    if (token === '' || lower.indexOf('end of json') !== -1) {
                        return 'JSON 内容不完整，缺少闭合的括号或引号';
                    }
                    return '意外的字符 \'' + token + '\'，请检查 JSON 格式';
                }
                return '发现意外字符，请检查 JSON 格式是否正确';
            }
            if (lower.indexOf('unterminated string') !== -1) {
                return '字符串引号未闭合';
            }
            if (lower.indexOf('expected') !== -1) {
                return msg.replace(/in JSON at position \d+/i, '').trim();
            }
            return msg.replace(/in JSON at position \d+/i, '').trim();
        }

        function highlightJSON(jsonStr) {
            var html = '';
            var i = 0;
            var len = jsonStr.length;

            while (i < len) {
                var ch = jsonStr[i];

                if (ch === '"') {
                    var j = i + 1;
                    while (j < len) {
                        if (jsonStr[j] === '\\') { j += 2; continue; }
                        if (jsonStr[j] === '"') break;
                        j++;
                    }
                    var fullStr = jsonStr.substring(i, j + 1);
                    var isKey = isJSONKey(jsonStr, j + 1);
                    if (isKey) {
                        html += '<span class="json-key">' + escapeHTML(fullStr) + '</span>';
                    } else {
                        html += '<span class="json-string">' + escapeHTML(fullStr) + '</span>';
                    }
                    i = j + 1;
                    continue;
                }

                if (ch === '{' || ch === '}' || ch === '[' || ch === ']') {
                    html += '<span class="json-bracket">' + ch + '</span>';
                    i++;
                    continue;
                }

                if (ch === ':') {
                    html += '<span class="json-colon">:</span>';
                    i++;
                    if (i < len && jsonStr[i] === ' ') { html += ' '; i++; }
                    continue;
                }

                if ((ch >= '0' && ch <= '9') || ch === '-') {
                    var j = i;
                    while (j < len && /[0-9eE+\-.]/.test(jsonStr[j])) j++;
                    html += '<span class="json-number">' + escapeHTML(jsonStr.substring(i, j)) + '</span>';
                    i = j;
                    continue;
                }

                if (jsonStr.substring(i, i + 4) === 'true') {
                    html += '<span class="json-boolean">true</span>';
                    i += 4;
                    continue;
                }
                if (jsonStr.substring(i, i + 5) === 'false') {
                    html += '<span class="json-boolean">false</span>';
                    i += 5;
                    continue;
                }
                if (jsonStr.substring(i, i + 4) === 'null') {
                    html += '<span class="json-null">null</span>';
                    i += 4;
                    continue;
                }

                html += ch;
                i++;
            }

            return html;
        }

        function isJSONKey(str, startPos) {
            var i = startPos;
            var len = str.length;
            while (i < len && (str[i] === ' ' || str[i] === '\n' || str[i] === '\r' || str[i] === '\t')) {
                i++;
            }
            return i < len && str[i] === ':';
        }

        function escapeHTML(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = '';
            document.getElementById('outputContainer').classList.remove('has-content');
            document.getElementById('errorBox').classList.remove('show');
            document.getElementById('statusText').textContent = '';
            document.getElementById('statusText').classList.remove('status-success');
            document.getElementById('inputCount').textContent = '0 字符';
            document.getElementById('outputCount').textContent = '0 字符';
            document.getElementById('input').focus();
        }

        function copyResult() {
            var output = document.getElementById('output');
            var text = output.textContent || '';
            if (!text) return;

            var copyBtn = document.getElementById('copyBtn');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showCopiedFeedback(copyBtn);
                }).catch(function() {
                    fallbackCopy(text, copyBtn);
                });
            } else {
                fallbackCopy(text, copyBtn);
            }
        }

        function fallbackCopy(text, copyBtn) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showCopiedFeedback(copyBtn);
            } catch (e) {
                copyBtn.textContent = '❌ 复制失败';
                setTimeout(function() {
                    copyBtn.textContent = '📋 复制结果';
                }, 2000);
            }
            document.body.removeChild(textarea);
        }

        function showCopiedFeedback(btn) {
            var originalText = btn.textContent;
            btn.textContent = '✅ 已复制';
            btn.classList.add('copied');
            setTimeout(function() {
                btn.textContent = originalText;
                btn.classList.remove('copied');
            }, 2000);
        }

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                formatJSON();
            }
        });
    </script>
</body>
</html>
