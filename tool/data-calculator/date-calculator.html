<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期差值计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .current-date {
            background: #f5f7fa;
            padding: 12px 16px;
            border-radius: 8px;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .current-date strong {
            color: #333;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.days {
            background: #e8f5e9;
            border: 1px solid #4caf50;
        }

        .result.days-negative {
            background: #ffebee;
            border: 1px solid #f44336;
        }

        .result-number {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result.days .result-number {
            color: #4caf50;
        }

        .result.days-negative .result-number {
            color: #f44336;
        }

        .result-text {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        .error {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 日期差值计算器</h1>
        
        <div class="current-date">
            当前日期：<strong id="currentDateDisplay"></strong>
        </div>

        <div class="input-group">
            <label for="targetDate">选择日期</label>
            <input type="date" id="targetDate" />
        </div>

        <button onclick="calculateDays()">计算相差天数</button>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="result-number" id="resultNumber"></div>
            <div class="result-text" id="resultText"></div>
        </div>
    </div>

    <script>
        // 显示当前日期
        function displayCurrentDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekDay = weekDays[now.getDay()];
            
            document.getElementById('currentDateDisplay').textContent = 
                `${year}年${month}月${day}日 ${weekDay}`;
        }

        // 计算相差天数
        function calculateDays() {
            const targetDateInput = document.getElementById('targetDate').value;
            const resultDiv = document.getElementById('result');
            const resultNumber = document.getElementById('resultNumber');
            const resultText = document.getElementById('resultText');
            const errorDiv = document.getElementById('error');

            // 重置状态
            resultDiv.classList.remove('show', 'days', 'days-negative');
            errorDiv.classList.remove('show');

            // 验证输入
            if (!targetDateInput) {
                errorDiv.textContent = '❌ 请选择一个日期';
                errorDiv.classList.add('show');
                return;
            }

            const targetDate = new Date(targetDateInput);
            const currentDate = new Date();
            
            // 重置时间为零点，确保只计算日期差
            targetDate.setHours(0, 0, 0, 0);
            currentDate.setHours(0, 0, 0, 0);

            // 计算毫秒差
            const diffTime = targetDate.getTime() - currentDate.getTime();
            // 转换为天数
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            // 显示结果
            resultDiv.classList.add('show');
            
            if (diffDays >= 0) {
                resultDiv.classList.add('days');
                resultNumber.textContent = diffDays;
                if (diffDays === 0) {
                    resultText.textContent = '输入的日期就是今天！';
                } else if (diffDays === 1) {
                    resultText.textContent = '输入的日期是明天';
                } else {
                    resultText.textContent = `距离今天还有 ${diffDays} 天`;
                }
            } else {
                resultDiv.classList.add('days-negative');
                resultNumber.textContent = Math.abs(diffDays);
                if (diffDays === -1) {
                    resultText.textContent = '输入的日期是昨天';
                } else {
                    resultText.textContent = `距离今天已经过去 ${Math.abs(diffDays)} 天`;
                }
            }
        }

        // 页面加载时显示当前日期
        displayCurrentDate();

        // 支持按 Enter 键计算
        document.getElementById('targetDate').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateDays();
            }
        });
    </script>
</body>
</html>
